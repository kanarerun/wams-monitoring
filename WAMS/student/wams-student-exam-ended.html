<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAMS — Exam Ended</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#0D1B3E,#0a1530);font-family:Inter,sans-serif;color:#fff}
    main{width:min(100%,440px);padding:34px 30px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:20px;background:rgba(255,255,255,.04)}
    .icon{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;display:grid;place-items:center;background:#B45309;font-size:32px;font-weight:700}
    h1{margin:0 0 12px;font-size:24px}
    p{margin:0;color:rgba(255,255,255,.72);font-size:14px;line-height:1.7}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <h1>Exam Ended</h1>
    <p>This exam has ended. You can no longer enter the exam or submit answers. You may close this page.</p>
  </main>
</body>
</html>
