services:
  - type: web
    name: wams
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: wams-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/wams.db
